<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f8fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.08);
  }

  .card-header {
    background: #4a90f7;
    padding: 32px 40px 28px;
    text-align: center;
  }
  .card-header img {
    width: 64px;
    height: auto;
    margin-bottom: 10px;
  }
  .card-header h1 {
    margin: 0;
    color: #fff;
    font-size: 19px;
    font-weight: 600;
  }
  .card-header p {
    margin: 4px 0 0;
    color: #e3edfe;
    font-size: 13px;
  }

  form {
    padding: 36px 40px 28px;
  }

  .field {
    position: relative;
    margin-bottom: 24px;
  }

  .field label {
    position: absolute;
    left: 0;
    top: 20px;
    font-size: 15px;
    color: #757575;
    background: #fff;
    padding-right: 4px;
    pointer-events: none;
    transition: all 0.15s ease;
    z-index: 1;
  }

  .field.floated label { top: 0; font-size: 12px; }
  .field.focused label { color: #4a90f7; }
  .field.error label { color: #e53935; }

  .field input {
    position: relative;
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid #d0d0d0;
    outline: none;
    font-size: 15px;
    color: #1a1a1a;
    padding: 20px 0 8px;
    font-family: inherit;
  }
  .field.error input { border-bottom-color: #e53935; }

  .field .underline {
    position: absolute;
    left: 0; right: 0; bottom: -1.5px;
    height: 2px;
    background: #4a90f7;
    transform: scaleX(0);
    transition: transform 0.2s ease;
  }
  .field.focused:not(.error) .underline { transform: scaleX(1); }

  .field .toggle-pw {
    position: absolute;
    right: 0;
    top: 16px;
    background: none;
    border: none;
    cursor: pointer;
    color: #9aa0a6;
    padding: 4px;
    display: flex;
    z-index: 1;
  }
  .field .toggle-pw:hover { color: #5f6368; }

  .helper {
    margin-top: 4px;
    font-size: 12px;
    color: #e53935;
    display: none;
    align-items: center;
    gap: 4px;
  }
  .field.error .helper { display: flex; }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -8px 0 24px;
    font-size: 13px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #4a4a4a;
    cursor: pointer;
    user-select: none;
  }
  .remember input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border: 2px solid #9aa0a6;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    margin: 0;
    transition: background 0.15s ease, border-color 0.15s ease;
    flex-shrink: 0;
  }
  .remember input[type="checkbox"]:checked {
    background: #4a90f7;
    border-color: #4a90f7;
  }
  .remember input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 0px;
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .forgot-link {
    color: #4a90f7;
    text-decoration: none;
    font-weight: 500;
  }
  .forgot-link:hover { text-decoration: underline; }

  .submit-btn {
    width: 100%;
    background: #4a90f7;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .submit-btn:hover { background: #3a7de0; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .submit-btn:active { background: #2f6fd0; }

  .signup-note {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: #757575;
  }
  .signup-note a {
    color: #4a90f7;
    text-decoration: none;
    font-weight: 500;
  }
  .signup-note a:hover { text-decoration: underline; }

  .icon { width: 16px; height: 16px; flex-shrink: 0; }

  @media (max-width: 480px) {
    .card-header { padding: 26px 24px 22px; }
    form { padding: 28px 24px 22px; }
  }
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
</head>
<body>

<div class="card">
  <div class="card-header">
    <img src="logo.svg" alt="Engineering & General Services Division logo" />
    <h1>Engineering &amp; General Services Division</h1>
    <p>Sign in to your account</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="field" id="field-email">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" />
      <div class="underline"></div>
      <div class="helper" id="helper-email"></div>
    </div>

    <div class="field" id="field-password">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" />
      <div class="underline"></div>
      <button type="button" class="toggle-pw" data-target="password">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <div class="helper" id="helper-password"></div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="remember" name="remember" />
        Remember me
      </label>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="submit-btn">Sign in</button>

    <p class="signup-note">Don't have an account? <a href="registration.html">Register</a></p>
  </form>
</div>

<script>
  const errorIconSvg = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

  ['email', 'password'].forEach(id => {
    const input = document.getElementById(id);
    const fieldEl = document.getElementById('field-' + id);

    const updateFloat = () => {
      if (input.value && input.value.length > 0) {
        fieldEl.classList.add('floated');
      } else {
        fieldEl.classList.remove('floated');
      }
    };

    input.addEventListener('focus', () => fieldEl.classList.add('focused'));
    input.addEventListener('blur', () => {
      fieldEl.classList.remove('focused');
      validateField(id);
    });
    input.addEventListener('input', updateFloat);
    updateFloat();
  });

  document.querySelectorAll('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.getAttribute('data-target');
      const input = document.getElementById(targetId);
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.innerHTML = isPw
        ? '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.22 4.53M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
    });
  });

  function setError(fieldKey, message) {
    const fieldEl = document.getElementById('field-' + fieldKey);
    const helperEl = document.getElementById('helper-' + fieldKey);
    if (message) {
      fieldEl.classList.add('error');
      helperEl.innerHTML = errorIconSvg + message;
    } else {
      fieldEl.classList.remove('error');
      helperEl.innerHTML = '';
    }
  }

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function validateField(fieldKey) {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let message = '';
    if (fieldKey === 'email') {
      message = !emailPattern.test(email) ? 'Enter a valid email address' : '';
    } else if (fieldKey === 'password') {
      message = password.length === 0 ? 'Password is required' : '';
    }
    setError(fieldKey, message);
    return message === '';
  }

  const loginForm = document.getElementById('loginForm');

  function showFormError(message) {
    let errEl = document.getElementById('formError');
    if (!errEl) {
      errEl = document.createElement('div');
      errEl.id = 'formError';
      errEl.style.cssText = 'background:#fdecea;color:#e53935;font-size:13px;padding:10px 14px;border-radius:4px;margin-bottom:18px;';
      loginForm.insertBefore(errEl, loginForm.firstChild);
    }
    errEl.textContent = message;
  }

  function hideFormError() {
    const errEl = document.getElementById('formError');
    if (errEl) errEl.remove();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const ok1 = validateField('email');
    const ok2 = validateField('password');
    if (!ok1 || !ok2) return;

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const submitBtn = loginForm.querySelector('.submit-btn');
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    hideFormError();

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;

    if (error) {
      showFormError('Incorrect email or password.');
      return;
    }

    const displayName = data.user.user_metadata?.codename || email;
    alert(`Welcome back, ${displayName}!`);
    // Redirect to your app's main page here, e.g.:
    // window.location.href = "dashboard.html";
  });
</script>

</body>
</html>
