<svg width="260" height="300" viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B9CFB"/>
      <stop offset="100%" stop-color="#2E6FE0"/>
    </linearGradient>
    <path id="ringPath" d="M 54,118 a 76,76 0 1,1 152,0" fill="none"/>
  </defs>

  <!-- Cog teeth (Engineering) -->
  <g fill="#ffffff" transform="translate(130,120)"><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(0.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(30.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(60.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(90.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(120.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(150.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(180.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(210.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(240.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(270.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(300.0)"/><rect x="-7.5" y="-112" width="15" height="18" rx="2" transform="rotate(330.0)"/></g>

  <!-- Outer ring base -->
  <circle cx="130" cy="120" r="100" fill="url(#bg)"/>
  <circle cx="130" cy="120" r="100" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

  <!-- Inner white face -->
  <circle cx="130" cy="120" r="86" fill="#ffffff"/>
  <circle cx="130" cy="120" r="86" fill="none" stroke="#2E6FE0" stroke-width="1.5" opacity="0.2"/>

  <!-- Curved division name along top -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="1.6">
    <textPath href="#ringPath" startOffset="50%" text-anchor="middle">
      ENGINEERING &amp; GENERAL SERVICES
    </textPath>
  </text>

  <!-- Building / General Services glyph -->
  <g transform="translate(102,94)" fill="#2E6FE0">
    <polygon points="0,18 28,2 56,18"/>
    <rect x="0" y="20" width="56" height="5" rx="1"/>
    <rect x="5" y="27" width="7" height="22"/>
    <rect x="17" y="27" width="7" height="22"/>
    <rect x="29" y="27" width="7" height="22"/>
    <rect x="41" y="27" width="7" height="22"/>
    <rect x="-3" y="51" width="62" height="5" rx="1"/>
  </g>

  <!-- Small gear accent (Engineering) -->
  <g transform="translate(176,166)" fill="#5B9CFB">
    <circle r="15"/>
    <g><rect x="-2.4" y="-19" width="4.8" height="6" rx="1" transform="rotate(0.0)"/><rect x="-2.4" y="-19" width="4.8" height="6" rx="1" transform="rotate(45.0)"/><rect x="-2.4" y="-19" width="4.8" height="6" rx="1" transform="rotate(90.0)"/><rect x="-2.4" y="-19" width="4.8" height="6" rx="1" transform="rotate(135.0)"/><rect x="-2.4" y="-19" width="4.8" height="6" rx="1" transform="rotate(180.0)"/><rect x="-2.4" y="-19" width="4.8" height="6" rx="1" transform="rotate(225.0)"/><rect x="-2.4" y="-19" width="4.8" height="6" rx="1" transform="rotate(270.0)"/><rect x="-2.4" y="-19" width="4.8" height="6" rx="1" transform="rotate(315.0)"/></g>
    <circle r="6.5" fill="#ffffff"/>
  </g>

  <!-- Monogram -->
  <text x="130" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700"
        fill="#2E6FE0" letter-spacing="3" text-anchor="middle">EGSD</text>
  <text x="130" y="278" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="500"
        fill="#8a94a3" letter-spacing="1" text-anchor="middle">ENGINEERING &amp; GENERAL SERVICES DIVISION</text>
</svg>
